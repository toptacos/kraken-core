name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyyaml
      - name: Import core and doctor
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import kraken; print('ok')"
          python -m kraken self plan
          python -m pytest tests/test_config_chain.py tests/test_license.py tests/test_first_run.py -q
